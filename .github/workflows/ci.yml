name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: the meshes are generated during the build and scripts/make_meshes.sh requires Gmsh 4.12.1,
    # the version Ubuntu 24.04 ships.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeigen3-dev gmsh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTMFEM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      # The slow-labelled tests (level-4 elastoplastic hole plate, about 11 min) run in full-suite.yml.
      - name: Test (without slow tests)
        run: ctest --test-dir build --output-on-failure -LE slow
