name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTMFEM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      # The slow-labelled tests (level-4 elastoplastic hole plate, about 11 min) run in full-suite.yml.
      - name: Test (without slow tests)
        run: ctest --test-dir build --output-on-failure -LE slow
